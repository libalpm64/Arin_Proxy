<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arin Proxy</title>
  <style>body{font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;display: flex;justify-content: center;align-items: center;min-height: 100vh;margin: 0;background: #000;color: #fff;line-height: 1.5}.container{background: rgba(30, 30, 40, 0.6);padding: 1.8rem;border-radius: 16px;box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.08);backdrop-filter: blur(12px);-webkit-backdrop-filter: blur(12px);text-align: center;max-width: 420px;width: 92vw}h1{margin: 0 0 0.8rem;font-size: 1.6rem;font-weight: 600}p{margin: 0.6rem 0;font-size: 0.95rem;opacity: 0.9}.progress-wrapper{display: flex;flex-direction: column;align-items: center;gap: 0.5rem;margin: 1rem auto}#progress-bar{width: 100%;height: 8px;background: rgba(255, 255, 255, 0.08);border-radius: 4px;overflow: hidden}#progress{height: 100%;width: 0;background: #4d79ff;transition: width 0.6s cubic-bezier(0.2, 0.8, 0.4, 1);box-shadow: 0 0 6px rgba(77, 121, 255, 0.5)}#debug{text-align: left;margin-top: 1.2rem;font-size: 0.82rem;opacity: 0.75}#debug > div{display: flex;align-items: center;margin-bottom: 0.25rem}#debug strong{flex-shrink: 0;width: 90px;opacity: 0.9}#debug span{font-family: ui-monospace, 'SF Mono', Monaco, Consolas, monospace;font-size: 0.78rem;word-break: break-all;flex: 1}</style>
  <script src="https://cdn.jsdelivr.net/gh/libalpm64/Blake3-JS@main/Blake3-PoW.js"></script>
  <script>document.addEventListener('DOMContentLoaded',async()=>{await Blake3.startPowChallenge({challengeSecret:"{challenge_secret}",difficulty:{difficulty}})});</script>
</head>
<body>
  <div class="container">
    <h1>Arin Proxy</h1>
    <p>Please wait, we are verifying that you are human…<br><small>(this may take a few seconds)</small></p>
    <div class="progress-wrapper">
      <div id="progress-bar"><div id="progress"></div></div>
      <p id="status">Verifying your browser…</p>
    </div>
    <div id="debug">
      <div><strong>Difficulty:</strong> <span id="dbg-difficulty"></span></div>
      <div><strong>Range:</strong> <span id="dbg-range">(0,100000)</span></div>
      <div><strong>Current Hash:</strong> <span id="dbg-hash-current" style="font-size:0.58rem;">(pending)</span></div>
      <div><strong>Solved Hash:</strong> <span id="dbg-hash" style="font-size:0.58rem;">(pending)</span></div>
      <div><strong>Salt:</strong> <span id="dbg-salt"></span></div>
    </div>
  </div>
</body>
</html>
