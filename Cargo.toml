[package]
name = "Arin"
version = "2.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "client-legacy", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
parking_lot = "0.12"
socket2 = { version = "0.6", default-features = false }
dashmap = { version = "6", default-features = false }
blake3 = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
panic = "abort"
overflow-checks = false
strip = true

[profile.release.package.blake3]
opt-level = 3
