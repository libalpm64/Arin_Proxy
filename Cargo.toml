[package]
name = "Arin"
version = "2.0.0"
edition = "2024"

[dependencies]
actix-web = "4.11"
actix-rt = "2.11"
awc = { version = "3", features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.1"
log = "0.4"
# env_logger = "0.11"
mimalloc = "0.1"
crossbeam-channel = "0.5"
tokio = { version = "1", features = ["sync"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
panic = "abort"
overflow-checks = false

[build]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "target-feature=+avx2,+bmi2,+fma",
    "-C", "opt-level=3",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
    "-C", "inline-threshold=500",
    "-C", "prefer-dynamic=no"
]
