[package]
name = "Arin"
version = "2.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11.3"
rand = "0.9"
parking_lot = "0.12"
socket2 = "0.6"
dashmap = "6"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
panic = "abort"
overflow-checks = false

[build]
rustflags = [
    "-C", "target-cpu=native",
    "-C", "target-feature=+avx2,+bmi2,+fma",
    "-C", "opt-level=3",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
    "-C", "inline-threshold=500",
    "-C", "prefer-dynamic=no"
]
